<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>TACTICS - V2 Proxy</title>
<!--
  TACTICS - V2 Proxy frame.
  One of these is loaded per browser tab in the Proxy tab of the site. It registers the
  Scramjet service worker (sw.js), sets up the Wisp transport and shows the proxied page.
  It talks to the browser UI with postMessage. This file must be hosted on the same origin
  as sw.js and baremux-worker.js (https://prox.site.je/Proxy/); every library comes from jsDelivr.
-->
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
iframe{border:0;width:100%;height:100%;display:block;background:#fff}
#status{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#202124;color:#e8eaed;padding:24px;box-sizing:border-box;text-align:center}
#status.show{display:flex}
#status .box{max-width:520px}
#status h1{font-size:20px;margin:0 0 10px}
#status p{font-size:14px;color:#9aa0a6;line-height:1.5;margin:0 0 8px;word-break:break-word}
#status button{margin-top:12px;background:#8ab4f8;color:#202124;border:0;border-radius:18px;padding:8px 18px;font-weight:600;cursor:pointer}
</style>
<script>
  // Sent before the libraries below load, so the browser UI knows the page got past the host's
  // anti-bot check (and queues commands until 'ready').
  try{ if(window.parent !== window) window.parent.postMessage({ tacticsProxy: 1, event: 'booting' }, '*'); }catch(e){}
</script>
</head>
<body>
<div id="status"><div class="box"><h1 id="statusTitle">Starting proxy...</h1><p id="statusText"></p><button id="statusRetry" style="display:none">Try again</button></div></div>
<script>
(function(){
  /* ---------- Proxy engines (all from jsDelivr) ----------
     sj  = Scramjet 1.1          (bare-mux + Epoxy/libcurl, prefix scramjet/)
     sj2 = Scramjet 2            (scramjet-controller, its own Epoxy 3 / libcurl 2 transport, prefix ~/sj/)
     uv  = Ultraviolet 3.2       (bare-mux + Epoxy/libcurl, prefix service/)
     is  = Interstellar's setup  (Ultraviolet with Interstellar's config, prefix uv/)
     sw.js (same folder) handles all four prefixes. */
  const NPM = 'https://cdn.jsdelivr.net/npm/';
  const SJ_CDN = NPM + '@mercuryworkshop/scramjet@1.1.0/dist/';
  const SJ2_CDN = NPM + '@mercuryworkshop/scramjet@2.0.67-alpha.2/dist/';
  const SJ2_CONTROLLER_CDN = NPM + '@mercuryworkshop/scramjet-controller@0.0.14/dist/';
  const BAREMUX_JS = NPM + '@mercuryworkshop/bare-mux@2.1.9/dist/index.js';
  // Transports: bare-mux engines use Epoxy 2 / libcurl 1, Scramjet 2 uses Epoxy 3 / libcurl 2.
  const TRANSPORTS = {
    epoxy:   { baremux: NPM + '@mercuryworkshop/epoxy-transport@2.1.28/dist/index.mjs',
               sj2: NPM + '@mercuryworkshop/epoxy-transport@3.0.1/dist/index.js', sj2Global: 'EpoxyTransport', sj2Class: 'default' },
    libcurl: { baremux: NPM + '@mercuryworkshop/libcurl-transport@1.5.2/dist/index.mjs',
               sj2: NPM + '@mercuryworkshop/libcurl-transport@2.0.5/dist/index.js', sj2Global: 'LibcurlTransport', sj2Class: 'default' }
  };
  // Wisp server used when none is set in the site's settings. The relay on this host
  // (assets/ProxyWorker, wss://<this host>/wisp/) is tried first: it forwards to the public server
  // through the proxy host, which helps on networks that block the public server directly.
  const PUBLIC_WISP = 'wss://wisp.mercurywork.shop/';
  const WISP_CACHE_KEY = 'tactics_wisp_ok';
  const WISP_CACHE_MS = 10 * 60 * 1000;
  const BASE = new URL('./', location.href);
  const params = new URLSearchParams(location.search);
  const engine = ['sj', 'sj2', 'uv', 'is'].includes(params.get('engine')) ? params.get('engine') : 'sj2';
  const transport = params.get('transport') === 'libcurl' ? 'libcurl' : 'epoxy';
  const askedWisp = (params.get('wisp') || '').trim();
  let wisp = '';
  // mode: '' = browser tab, 'player' = movie source (video controls, popups blocked),
  //       'fetch' = hidden frame that only fetches URLs for the site (no page shown).
  const mode = params.get('mode') || '';
  const embedded = window.parent !== window;

  const statusEl = document.getElementById('status');
  function showStatus(title, text, retry){
    document.getElementById('statusTitle').textContent = title;
    document.getElementById('statusText').textContent = text || '';
    document.getElementById('statusRetry').style.display = retry ? '' : 'none';
    statusEl.classList.add('show');
  }
  document.getElementById('statusRetry').addEventListener('click', ()=> location.reload());

  // The host sits behind an anti-bot check that sets a "__test" cookie. Browsers only send it
  // inside frames on other sites (like the TACTICS Proxy tab) if it is SameSite=None, so re-save it.
  try{
    const m = document.cookie.match(/(?:^|;\s*)__test=([^;]+)/);
    if(m) document.cookie = '__test=' + m[1] + '; max-age=31536000; path=/; SameSite=None; Secure';
  }catch(e){}

  // ?activate: opened in its own window by the Proxy tab only to pass the check above, then closes.
  if(params.has('activate')){
    showStatus('Proxy activated', 'You can close this window and go back to TACTICS.', false);
    try{ if(window.opener) window.opener.postMessage({ tacticsProxy: 1, event: 'activated' }, '*'); }catch(e){}
    setTimeout(()=>{ try{ window.close(); }catch(e){} }, 500);
    return;
  }

  function post(msg){
    if(!embedded) return;
    msg.tacticsProxy = 1;
    try{ window.parent.postMessage(msg, '*'); }catch(e){}
  }

  let scramjet = null;     // Scramjet 1.1 controller
  let sjFrame = null;      // Scramjet 1.1 frame
  let sj2Frame = null;     // Scramjet 2 frame
  let view = null;
  let bareClient = null;
  let ready = false;
  const queue = [];
  const workerUrl = ()=> new URL('baremux-worker.js?wisp=' + encodeURIComponent(wisp) + '&transport=' + transport, BASE).href;

  function loadScript(src){
    return new Promise((resolve, reject)=>{
      const sc = document.createElement('script');
      sc.src = src;
      sc.onload = ()=> resolve();
      sc.onerror = ()=> reject(new Error('Could not load ' + src.replace(NPM, '') + ' from jsDelivr.'));
      document.head.appendChild(sc);
    });
  }

  // Ultraviolet's "xor" URL codec (same as Ultraviolet.codec.xor), used by Ultraviolet and Interstellar.
  const uvXor = {
    encode(str){
      if(!str) return str;
      return encodeURIComponent(String(str).split('').map((ch, i)=> i % 2 ? String.fromCharCode(ch.charCodeAt(0) ^ 2) : ch).join(''));
    },
    decode(str){
      if(!str) return str;
      const [input, ...search] = String(str).split('?');
      return decodeURIComponent(input).split('').map((ch, i)=> i % 2 ? String.fromCharCode(ch.charCodeAt(0) ^ 2) : ch).join('') +
             (search.length ? '?' + search.join('?') : '');
    }
  };
  const UV_PREFIX = ()=> new URL('service/', BASE).pathname;
  const IS_PREFIX = ()=> new URL('uv/', BASE).pathname;
  const SJ2_PREFIX = ()=> new URL('~/sj/', BASE).pathname;

  /* ---------- Choosing a Wisp server ---------- */
  // A server counts as reachable once it sends its first Wisp packet (CONTINUE) over the socket.
  function probeWisp(url, ms){
    return new Promise((resolve)=>{
      let ws, done = false;
      const finish = (ok)=>{ if(done) return; done = true; try{ ws.close(); }catch(e){} resolve(ok); };
      try{ ws = new WebSocket(url); }catch(e){ resolve(false); return; }
      ws.binaryType = 'arraybuffer';
      ws.onmessage = ()=> finish(true);
      ws.onerror = ()=> finish(false);
      ws.onclose = ()=> finish(false);
      setTimeout(()=> finish(false), ms);
    });
  }
  // A Wisp server passed in (?wisp=, from Settings or an older copy of the site) is tried first,
  // but if it can't be reached the relay and the public server are still tried.
  async function pickWisp(){
    const asked = askedWisp && askedWisp !== 'auto' ? askedWisp : '';
    try{
      const c = JSON.parse(localStorage.getItem(WISP_CACHE_KEY) || 'null');
      if(c && c.url && c.asked === asked && Date.now() - c.at < WISP_CACHE_MS) return c.url;
    }catch(e){}
    const relay = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/wisp/';
    const list = [...new Set([asked, relay, PUBLIC_WISP].filter(Boolean))];
    const checks = list.map(u => probeWisp(u, 6000));
    for(let i = 0; i < list.length; i++){
      if(await checks[i]){
        try{ localStorage.setItem(WISP_CACHE_KEY, JSON.stringify({ url: list[i], asked, at: Date.now() })); }catch(e){}
        return list[i];
      }
    }
    throw new Error('Could not reach a Wisp server (' + list.join(' or ') + '). This device or network is probably blocking it. ' +
                    'Try another Wisp Server in Settings -> Proxy, or another network.');
  }

  function toReal(href){
    if(!href) return '';
    try{
      const u = new URL(href, location.href);
      if(u.origin === location.origin){
        const real = decodeProxied(u);
        if(real) return real;
      }
      if(u.protocol === 'http:' || u.protocol === 'https:') return u.href;
    }catch(e){}
    return '';
  }
  function scramjet_prefix(){ return new URL('scramjet/', BASE).pathname; }

  // A proxied URL on this host -> the real URL it shows ('' if it isn't one).
  function decodeProxied(u){
    const path = u.pathname, rest = u.href.slice(u.origin.length);
    try{
      if(scramjet && path.indexOf(scramjet_prefix()) === 0) return scramjet.decodeUrl(u.href);
      if(path.indexOf(UV_PREFIX()) === 0) return uvXor.decode(rest.slice(UV_PREFIX().length));
      if(path.indexOf(IS_PREFIX()) === 0) return uvXor.decode(rest.slice(IS_PREFIX().length));
      if(path.indexOf(SJ2_PREFIX()) === 0){
        // ~/sj/<controller id>/<frame id>/<encoded url>
        const parts = rest.slice(SJ2_PREFIX().length).split('/');
        const real = new URL(decodeURIComponent(parts.slice(2).join('/')));
        // Scramjet 2 adds its own $-prefixed query parameters (e.g. $io, $rfs, $csr, $fs) after redirects.
        [...real.searchParams.keys()].filter(k => k.startsWith('$')).forEach(k => real.searchParams.delete(k));
        return real.href;
      }
    }catch(e){}
    return '';
  }

  // Load a real URL in the proxied view with the selected engine.
  function goTo(url){
    if(engine === 'sj') sjFrame.go(url);
    else if(engine === 'sj2') sj2Frame.go(url);
    else view.src = (engine === 'uv' ? UV_PREFIX() : IS_PREFIX()) + uvXor.encode(url);
  }

  function currentUrl(){
    if(engine === 'sj'){ try{ const u = sjFrame.url; if(u && u.href) return u.href; }catch(e){} }
    try{ return toReal(view.contentWindow.location.href); }catch(e){}
    return '';
  }

  /* ---------- State reporting ---------- */
  let last = {};
  let loading = false;
  function report(force){
    if(!view) return;
    let title = '', canBack = null, canForward = null;
    const url = currentUrl();
    try{ const d = view.contentDocument; if(d) title = d.title || ''; }catch(e){}
    try{
      const nav = view.contentWindow.navigation;
      if(nav && typeof nav.canGoBack === 'boolean'){ canBack = nav.canGoBack; canForward = nav.canGoForward; }
    }catch(e){}
    const state = { url, title, canBack, canForward, loading };
    if(!force && JSON.stringify(state) === JSON.stringify(last)) return;
    last = state;
    post(Object.assign({ event: 'state' }, state));
    if(!embedded && title) document.title = title;
  }

  /* ---------- Favicon (fetched through the proxied page so it goes via Scramjet) ---------- */
  let lastFavFor = '';
  async function sendFavicon(){
    let win, doc, pageUrl = currentUrl();
    try{ win = view.contentWindow; doc = view.contentDocument; }catch(e){ return; }
    if(!win || !doc || !pageUrl || pageUrl === lastFavFor) return;
    lastFavFor = pageUrl;
    let raw = '';
    try{
      const link = doc.querySelector('link[rel~="icon" i], link[rel="shortcut icon" i], link[rel="apple-touch-icon" i]');
      if(link) raw = link.getAttribute('href') || '';
    }catch(e){}
    let target = '';
    try{
      if(raw && /^data:/i.test(raw)){ post({ event: 'favicon', url: pageUrl, favicon: raw }); return; }
      target = raw ? (toReal(raw) || new URL(raw, pageUrl).href) : new URL('/favicon.ico', pageUrl).href;
    }catch(e){ return; }
    try{
      const res = await win.fetch(target);
      if(!res.ok) throw new Error('bad status');
      const blob = await res.blob();
      if(!blob.size || blob.size > 300000 || (blob.type && !/^image\//i.test(blob.type))) throw new Error('not an image');
      const dataUrl = await new Promise((resolve, reject)=>{
        const fr = new FileReader();
        fr.onload = ()=> resolve(fr.result);
        fr.onerror = reject;
        fr.readAsDataURL(blob);
      });
      post({ event: 'favicon', url: pageUrl, favicon: dataUrl });
    }catch(e){
      post({ event: 'favicon', url: pageUrl, favicon: '' });
    }
  }

  /* ---------- Hooks inside each proxied page ---------- */
  function hookPage(){
    let win, doc;
    try{ win = view.contentWindow; doc = view.contentDocument; }catch(e){ return; }
    if(!win || !doc || win.__tacticsHooked) return;
    try{ win.__tacticsHooked = true; }catch(e){}

    // Links that would open a new window open as a new browser tab instead.
    const onLink = (e)=>{
      const a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
      if(!a || e.defaultPrevented) return;
      const wantsNew = (a.target && a.target !== '_self' && a.target !== '_top' && a.target !== '_parent') || e.ctrlKey || e.metaKey || e.button === 1;
      if(!wantsNew) return;
      const real = toReal(a.href);
      if(!real) return;
      e.preventDefault(); e.stopPropagation();
      post({ event: 'newtab', url: real, background: !!(e.ctrlKey || e.metaKey || e.button === 1) });
    };
    try{ doc.addEventListener('click', onLink, true); doc.addEventListener('auxclick', onLink, true); }catch(e){}

    // window.open() also becomes a new browser tab.
    try{
      const origOpen = win.open;
      win.open = function(u){
        try{
          if(u){
            const real = toReal(new URL(String(u), currentUrl() || undefined).href);
            if(real){ post({ event: 'newtab', url: real }); return null; }
          }
        }catch(e){}
        return origOpen.apply(this, arguments);
      };
    }catch(e){}

    try{ win.addEventListener('pagehide', ()=>{ loading = true; report(); }); }catch(e){}
    try{ new MutationObserver(()=> report()).observe(doc.querySelector('title') || doc.head || doc.documentElement, { childList: true, subtree: true, characterData: true }); }catch(e){}
  }

  /* ---------- fetch mode: fetch a URL for the site, straight over Wisp (no CORS) ---------- */
  async function doFetch(msg){
    try{
      if(!bareClient) throw new Error('Proxy fetch is not available in this frame');
      const init = { method: msg.method || 'GET', headers: msg.headers || {}, redirect: 'follow' };
      if(msg.body !== undefined && init.method !== 'GET' && init.method !== 'HEAD') init.body = msg.body;
      const res = await bareClient.fetch(msg.url, init);
      const body = await res.arrayBuffer();
      const headers = [];
      try{ res.headers.forEach((v, k)=> headers.push([k, v])); }catch(e){}
      window.parent.postMessage({ tacticsProxy: 1, event: 'fetchResult', id: msg.id, status: res.status, statusText: res.statusText,
                                  headers, finalUrl: res.finalURL || msg.url, body }, '*', [body]);
    }catch(e){
      post({ event: 'fetchResult', id: msg.id, error: (e && e.message) || String(e) });
    }
  }

  /* ---------- player mode: drive the <video> inside the (proxied, same-origin) embed ---------- */
  // Embed players nest their video a few frames deep; through the proxy every frame is on this
  // origin, so the video can be found and controlled from here. Popups (ads) are blocked too.
  function eachWindow(win, depth, fn){
    if(!win || depth > 6) return;
    let doc;
    try{ doc = win.document; }catch(e){ return; }
    if(!doc) return;
    fn(win, doc);
    let frames = [];
    try{ frames = doc.querySelectorAll('iframe, frame'); }catch(e){}
    frames.forEach(f=>{ try{ eachWindow(f.contentWindow, depth + 1, fn); }catch(e){} });
  }
  function findVideo(){
    let best = null;
    eachWindow(view && view.contentWindow, 0, (win, doc)=>{
      try{
        doc.querySelectorAll('video').forEach(v=>{
          if(!best || (v.duration || 0) > (best.duration || 0)) best = v;
        });
      }catch(e){}
    });
    return best;
  }
  function blockPopups(){
    eachWindow(view && view.contentWindow, 0, (win)=>{
      try{
        if(win.__tacticsNoPopups) return;
        win.__tacticsNoPopups = true;
        win.open = function(){ return null; };
      }catch(e){}
    });
  }
  let lastMedia = '';
  function reportMedia(){
    blockPopups();
    const v = findVideo();
    const m = v && isFinite(v.duration) && v.duration > 0
      ? { has: true, paused: v.paused, t: Math.floor(v.currentTime), d: Math.floor(v.duration) }
      : { has: false };
    const key = JSON.stringify(m);
    if(key === lastMedia) return;
    lastMedia = key;
    post(Object.assign({ event: 'media' }, m));
  }
  function mediaCmd(msg){
    const v = findVideo();
    if(!v) return;
    try{
      if(msg.action === 'toggle'){ if(v.paused) v.play().catch(()=>{}); else v.pause(); }
      else if(msg.action === 'seekBy') v.currentTime = Math.max(0, Math.min(v.duration || 0, v.currentTime + Number(msg.value || 0)));
      else if(msg.action === 'seekTo' && v.duration) v.currentTime = Math.max(0, Math.min(1, Number(msg.value || 0))) * v.duration;
    }catch(e){}
    reportMedia();
  }

  /* ---------- Commands from the browser UI ---------- */
  function run(msg){
    if(!ready){ queue.push(msg); return; }
    try{
      switch(msg.cmd){
        case 'fetch': doFetch(msg); break;
        case 'media': mediaCmd(msg); break;
        case 'go':
          if(msg.url){ loading = true; lastFavFor = ''; goTo(msg.url); report(); }
          break;
        case 'back': view.contentWindow.history.back(); break;
        case 'forward': view.contentWindow.history.forward(); break;
        case 'reload': loading = true; report(); view.contentWindow.location.reload(); break;
        case 'stop': view.contentWindow.stop(); loading = false; report(); break;
        case 'focus': view.focus(); break;
        case 'state': report(true); break;
      }
    }catch(e){
      if(msg.cmd === 'reload' || msg.cmd === 'go'){ const u = msg.url || currentUrl(); if(u) goTo(u); }
    }
  }
  window.addEventListener('message', (e)=>{
    if(e.source !== window.parent) return;
    const d = e.data;
    if(!d || d.tacticsProxy !== 1 || !d.cmd) return;
    run(d);
  });

  /* ---------- Boot ---------- */
  // bare-mux connection whose worker (baremux-worker.js) already has the Wisp transport set.
  async function connectBareMux(){
    if(typeof BareMux === 'undefined') await loadScript(BAREMUX_JS);
    const conn = new BareMux.BareMuxConnection(workerUrl());
    let cur = '';
    try{ cur = await conn.getTransport(); }catch(e){}
    if(!cur) await conn.setTransport(TRANSPORTS[transport].baremux, [{ wisp }]);
    return conn;
  }

  async function registerServiceWorker(){
    if(!('serviceWorker' in navigator)) throw new Error('Service workers are blocked in this browser window (incognito or a locked-down browser can cause this).');
    await navigator.serviceWorker.register(new URL('sw.js', BASE).href, { scope: BASE.pathname });
    await navigator.serviceWorker.ready;
    if(!navigator.serviceWorker.controller){
      await new Promise((resolve)=>{
        navigator.serviceWorker.addEventListener('controllerchange', resolve, { once: true });
        setTimeout(resolve, 5000);
      });
    }
    if(!navigator.serviceWorker.controller){
      // First visit in some browsers needs one reload before the worker takes control.
      let tries = 0;
      try{ tries = Number(sessionStorage.getItem('tactics_sw_reload') || 0); sessionStorage.setItem('tactics_sw_reload', String(tries + 1)); }catch(e){ tries = 9; }
      if(tries < 2){ location.reload(); return false; }
      throw new Error('The proxy service worker did not start. Try reloading the tab.');
    }
    try{ sessionStorage.removeItem('tactics_sw_reload'); }catch(e){}
    return true;
  }

  function makeView(el){
    view = el || document.createElement('iframe');
    view.setAttribute('allow', 'autoplay; fullscreen; clipboard-read; clipboard-write; encrypted-media; picture-in-picture; microphone; camera; geolocation; gamepad');
    view.setAttribute('allowfullscreen', '');
    if(!view.isConnected) document.body.appendChild(view);
    view.addEventListener('load', ()=>{
      loading = false;
      hookPage();
      report(true);
      sendFavicon();
    });
  }

  async function boot(){
    if(mode === 'fetch'){
      // Only needs bare-mux (no service worker or proxy engine): requests go straight over Wisp.
      wisp = await pickWisp();
      await connectBareMux();
      bareClient = new BareMux.BareClient(workerUrl());
      return true;
    }

    if(engine === 'sj'){
      await loadScript(SJ_CDN + 'scramjet.all.js');
      const { ScramjetController } = $scramjetLoadController();
      scramjet = new ScramjetController({
        prefix: scramjet_prefix(),
        files: {
          wasm: new URL('scramjet.wasm.wasm', BASE).pathname,
          all: SJ_CDN + 'scramjet.all.js',
          sync: SJ_CDN + 'scramjet.sync.js'
        }
      });
      await scramjet.init();
    }

    if(!(await registerServiceWorker())) return false;
    wisp = await pickWisp();

    if(engine === 'sj2'){
      // Scramjet 2 runs the transport in this page; sw.js forwards requests here.
      const t = TRANSPORTS[transport];
      await loadScript(SJ2_CDN + 'scramjet.js');
      await loadScript(SJ2_CONTROLLER_CDN + 'controller.api.js');
      await loadScript(t.sj2);
      const { Controller, config } = window.$scramjetController;
      config.prefix = SJ2_PREFIX();
      config.scramjetPath = SJ2_CDN + 'scramjet.js';
      config.wasmPath = SJ2_CDN + 'scramjet.wasm';
      config.injectPath = SJ2_CONTROLLER_CDN + 'controller.inject.js';
      const Transport = window[t.sj2Global][t.sj2Class];
      const controller = new Controller({ serviceworker: navigator.serviceWorker.controller, transport: new Transport({ wisp }) });
      await controller.wait();
      // scramjet-controller 0.0.14 can deadlock when a response sets cookies: the response waits for a
      // cookie broadcast through the service worker, which is still waiting on that same response.
      // The cookies are already saved (persistCookies) by then, so let the broadcast run on its own.
      const syncCookies = controller.propagateCookieSync.bind(controller);
      controller.propagateCookieSync = (...args)=>{ syncCookies(...args).catch(()=>{}); return Promise.resolve(); };
      makeView();
      sj2Frame = controller.createFrame(view);
      return true;
    }

    // Scramjet 1.1, Ultraviolet and Interstellar all go through bare-mux.
    await connectBareMux();
    if(engine === 'sj'){
      sjFrame = scramjet.createFrame();
      makeView(sjFrame.frame);
      sjFrame.addEventListener('urlchange', ()=> report());
    } else {
      makeView();
    }
    return true;
  }

  boot().then((ok)=>{
    if(!ok) return;
    ready = true;
    statusEl.classList.remove('show');
    const initial = params.get('u') || decodeURIComponent(location.hash.slice(1) || '');
    if(initial) run({ cmd: 'go', url: initial });
    while(queue.length) run(queue.shift());
    post({ event: 'ready' });
    if(mode === 'fetch') return;
    setInterval(report, 600);
    if(mode === 'player') setInterval(reportMedia, 500);
  }).catch((err)=>{
    const msg = (err && err.message) ? err.message : String(err);
    showStatus('The proxy could not start', msg, true);
    post({ event: 'error', message: msg });
  });
})();
</script>
</body>
</html>
